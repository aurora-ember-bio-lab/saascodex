apiVersion: v1
kind: Service
metadata:
  name: {{ include "splatstudio.fullname" . }}
  labels:
    {{- include "splatstudio.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http-proxy
      protocol: TCP
      name: http
  selector:
    {{- include "splatstudio.selectorLabels" . | nindent 4 }}