{{- /*
  Non-secret env. Mirrors the values.yaml `env:` block.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "saascodex.fullname" . }}-config
  labels:
    {{- include "saascodex.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
