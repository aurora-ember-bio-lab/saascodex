name: splatstudio

services:
  splatstudio:
    container_name: splatstudio
    image: ${SPLATSTUDIO_IMAGE:-ghcr.io/aurora-ember-bio-lab/splatstudio:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      OD_BIND_HOST: 0.0.0.0
      OD_ALLOWED_ORIGINS: ${SPLATSTUDIO_ALLOWED_ORIGINS:-}
      OD_PORT: 7456
      OD_WEB_PORT: ${SPLATSTUDIO_PORT:-7456}
      OD_API_TOKEN: ${OD_API_TOKEN:-}
      OD_DISABLE_API_AUTH: ${SPLATSTUDIO_DISABLE_API_AUTH:-}
      OD_CODEX_SANDBOX: ${OD_CODEX_SANDBOX:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/splatstudio?sslmode=disable}
    ports:
      - "127.0.0.1:${SPLATSTUDIO_PORT:-7456}:7456"
    volumes:
      - open_design_data:/app/.od
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SPLATSTUDIO_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Postgres 16 with pgvector (control-plane database; see docs/DATABASE.md).
  postgres:
    container_name: splatstudio-postgres
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-splatstudio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - splatstudio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Atlas CLI with the migration directory mounted. Run ad-hoc, e.g.
  #   docker compose run --rm atlas migrate hash --dir file://migrations
  #   docker compose run --rm atlas migrate lint --dir file://migrations --dev-url <url>
  atlas:
    container_name: splatstudio-atlas
    image: arigaio/atlas:latest
    volumes:
      - ../db:/work
    working_dir: /work
    profiles: ["tools"]

  # One-shot migration runner: applies pending migrations on `up`.
  migrate:
    container_name: splatstudio-migrate
    image: arigaio/atlas:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../db:/work
    working_dir: /work
    command:
      [
        "migrate",
        "apply",
        "--dir",
        "file://migrations",
        "--url",
        "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-splatstudio}?sslmode=disable"
      ]
    restart: "no"

volumes:
  open_design_data:
  splatstudio_postgres_data:
