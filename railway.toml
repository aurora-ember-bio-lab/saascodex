# Railway config-as-code for the SaaSCodex daemon service.
# Docs: docs/DEPLOYMENT.md
#
# This builds the single runtime image (daemon + built web export) and runs
# it as an HTTP service. Railway injects `PORT`; the daemon takes it via
# `--port`. The Postgres companion service and the Atlas migration runner are
# separate services — see docs/DEPLOYMENT.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile"

[deploy]
startCommand = "node apps/daemon/dist/cli.js --no-open --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
