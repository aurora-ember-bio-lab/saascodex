name: release

# Cuts a GitHub Release from a version tag: builds the web + daemon, packages
# the runnable bundle with SHA256 checksums, publishes the container image to
# GHCR, and attaches the artifacts to the release.
# Docs: docs/RELEASING.md
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.23.1)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  artifacts:
    name: Build + package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @saascodex/web build
      - name: Build daemon
        run: pnpm --filter @saascodex/daemon build
      - name: Bundle daemon prod dependencies
        run: pnpm --filter @saascodex/daemon deploy --legacy --prod .release/daemon
      - name: Package release artifact
        run: pnpm exec tsx scripts/package-release.ts --daemon-dir .release/daemon --version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist-release/*
          if-no-files-found: error

  image:
    name: Publish container image
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  release:
    name: Create release
    needs: [artifacts, image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist-release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist-release/*.tar.gz
            dist-release/SHA256SUMS
