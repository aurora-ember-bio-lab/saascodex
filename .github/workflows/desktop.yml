name: desktop

# Builds SplatStudio desktop installers with Tauri v2 and attaches them to the
# release for a `v*` tag. Docs: desktop/tauri/README.md, docs/RELEASING.md
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux webkit deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Generate app icons from the brand mark
        working-directory: desktop/tauri
        run: npx --yes @tauri-apps/cli@^2 icon ../../assets/brand/icon.png
      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'SplatStudio ${{ github.ref_name }}'
          releaseBody: 'Desktop installers (Windows NSIS/MSI, macOS .dmg, Linux AppImage/.deb) built from the tag.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
