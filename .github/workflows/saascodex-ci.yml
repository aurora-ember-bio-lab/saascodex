name: saascodex-ci

# Fork-focused CI. The upstream `ci.yml` targets a self-hosted runner fleet and
# release infra that does not exist on this fork; this workflow runs the checks
# that matter here on standard GitHub-hosted runners.
#
# Upstream workflows that reference Nexu infrastructure can be disabled under
# Settings → Actions when the repo goes private (see docs/SECURITY.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saascodex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Guard, skills, typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # `pnpm install` runs the repo's postinstall bootstrap, which builds the
      # workspace packages the guard and typecheck depend on.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Guard
        run: pnpm guard
      - name: Skills catalog
        run: pnpm check:skills
      - name: Typecheck (web)
        run: pnpm --filter @saascodex/web typecheck
