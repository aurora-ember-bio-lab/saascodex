name: security

# Trivy security scanning: dependency/config/secret scan of the source tree,
# plus a scan of the built runtime image. Results are uploaded to the GitHub
# Security tab as SARIF. Docs: docs/SECURITY.md
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    name: Trivy (filesystem)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          trivyignores: .trivyignore
          # Report first, then flip to '1' once the baseline is clean.
          exit-code: '0'
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      # Hard gate: fail the build on any CRITICAL vulnerability. The reporting
      # step above still surfaces HIGH findings without failing.
      - name: Trivy critical gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

  trivy-image:
    name: Trivy (image)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f deploy/Dockerfile -t saascodex:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: saascodex:ci
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          trivyignores: .trivyignore
          exit-code: '0'
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
