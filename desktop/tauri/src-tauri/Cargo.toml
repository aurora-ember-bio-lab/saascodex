[package]
name = "saascodex-desktop"
version = "0.23.1"
description = "SaaSCodex desktop shell"
authors = ["Aurora Ember Cyber Bio Lab"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
